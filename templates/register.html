<!-- templates/register.html -->
{% extends "base.html" %}

{% block title %}Create account &mdash; {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="icon-circle mx-auto mb-3"><i class="bi bi-person-plus"></i></div>
        <h1 class="h4 fw-bold mb-1">Create your account</h1>
        <p class="text-secondary small mb-0">Store every authenticator you need in one place</p>
      </div>

      <form method="post" action="/register" class="vstack gap-3">
        <div>
          <label class="form-label fw-semibold" for="email">Email address</label>
          <input type="email" class="form-control form-control-lg" id="email" name="email"
                 placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div>
          <label class="form-label fw-semibold" for="password">Password</label>
          <input type="password" class="form-control form-control-lg" id="password" name="password"
                 placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
        </div>
        <div>
          <label class="form-label fw-semibold" for="confirm_password">Confirm password</label>
          <input type="password" class="form-control form-control-lg" id="confirm_password"
                 name="confirm_password" placeholder="Repeat your password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg mt-2">
          <i class="bi bi-person-check me-2"></i>Create account
        </button>
      </form>

      <p class="text-center text-secondary small mt-4 mb-0">
        Already have an account?
        <a href="/login" class="fw-semibold text-decoration-none">Sign in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
