<!-- templates/login.html -->
{% extends "base.html" %}

{% block title %}Sign in &mdash; {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="icon-circle mx-auto mb-3"><i class="bi bi-box-arrow-in-right"></i></div>
        <h1 class="h4 fw-bold mb-1">Welcome back</h1>
        <p class="text-secondary small mb-0">Sign in to view your authenticator codes</p>
      </div>

      <form method="post" action="/login" class="vstack gap-3">
        <div>
          <label class="form-label fw-semibold" for="email">Email address</label>
          <input type="email" class="form-control form-control-lg" id="email" name="email"
                 placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div>
          <label class="form-label fw-semibold" for="password">Password</label>
          <input type="password" class="form-control form-control-lg" id="password" name="password"
                 placeholder="Your password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg mt-2">
          <i class="bi bi-shield-lock me-2"></i>Sign in
        </button>
      </form>

      <p class="text-center text-secondary small mt-4 mb-0">
        Don&rsquo;t have an account?
        <a href="/register" class="fw-semibold text-decoration-none">Create one</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
