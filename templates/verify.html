<!-- templates/verify.html -->
{% extends "base.html" %}

{% block title %}Two-factor verification &mdash; {{ app_name }}{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="icon-circle mx-auto mb-3"><i class="bi bi-shield-check"></i></div>
        <h1 class="h4 fw-bold mb-1">Two-factor verification</h1>
        <p class="text-secondary small mb-0">
          Enter the 6-digit code from your authenticator app
        </p>
      </div>

      <form method="post" action="/verify" class="vstack gap-3">
        <div>
          <label class="form-label fw-semibold" for="code">Verification code</label>
          <input type="text" class="form-control form-control-lg text-center code-input"
                 id="code" name="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}"
                 placeholder="000000" autocomplete="one-time-code" autofocus required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg mt-2">
          <i class="bi bi-check2-circle me-2"></i>Verify &amp; continue
        </button>
      </form>

      <p class="text-center text-secondary small mt-4 mb-0">
        <a href="/login" class="fw-semibold text-decoration-none">Back to sign in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
